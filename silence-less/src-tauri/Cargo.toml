[package]
name = "silence-less-app"
version = "0.1.0"
edition = "2021"
description = "Application de bureau SilenceLess (Tauri)"

[lib]
name = "silence_less_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silence-less-core = { path = "../crates/silence-less-core" }
